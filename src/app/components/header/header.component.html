<header class="app-header">
  <a class="brand" routerLink="/all-orders">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-word">Weimar</span>
    <span class="brand-sub">Omedia lunch</span>
  </a>

  <span class="header-date">{{ today | date : "EEEE dd.MM.yyyy" }}</span>

  @if (currentUser$ | async; as currentUser) {
  <div class="user">
    <img
      class="avatar"
      [src]="currentUser.photoURL"
      alt=""
      referrerpolicy="no-referrer"
    />
    <span class="name">{{ currentUser.displayName }}</span>
    <button type="button" class="text-link" (click)="logout()">Log out</button>
  </div>
  }
</header>
