<svg viewBox="0 0 24 24" aria-hidden="true">
  @for (part of parts(); track $index) { @if (part.text) {
  <text x="12" y="16.5" text-anchor="middle" [attr.fill]="part.fill">{{ part.text }}</text>
  } @else {
  <path
    [attr.d]="part.d"
    [attr.fill]="part.fill ?? 'none'"
    [attr.stroke]="part.stroke ?? 'none'"
    [attr.stroke-width]="part.sw ?? 1.5"
    [attr.transform]="part.transform ?? null"
  />
  } } @if (mark() === 'remove') {
  <path class="strike-halo" d="M3.5 20.5l17-17" />
  <path class="strike" d="M3.5 20.5l17-17" />
  } @else if (mark() === 'add' || mark() === 'less') {
  <circle class="badge" cx="19.5" cy="4.5" r="4.5" />
  <path
    class="badge-sign"
    [attr.d]="mark() === 'add' ? 'M19.5 2.3v4.4M17.3 4.5h4.4' : 'M17.3 4.5h4.4'"
  />
  }
</svg>
